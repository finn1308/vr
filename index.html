<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Siêu Tốc - 28 Ảnh</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #000;
    }

    /* Thanh thông báo nhỏ phía trên, không chặn màn hình */
    #scanning-status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="scanning-status">Đang khởi tạo AR...</div>

  <!-- 
    - autoStart: true để bỏ qua bước nhấn nút
    - uiScanning: no để ẩn giao diện quét mặc định của thư viện
  -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; maxTrack: 1; filterMinCF: 0.1; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, antialias: false, precision: medium;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="ar-video" 
             src="video.mp4" 
             crossorigin="anonymous" 
             loop="true" 
             playsinline 
             webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="targets-container"></a-entity>
    
  </a-scene>

  <script>
    const TOTAL_IMAGES = 28;
    const sceneEl = document.querySelector('a-scene');
    const videoEl = document.querySelector('#ar-video');
    const container = document.querySelector('#targets-container');
    const statusLabel = document.querySelector("#scanning-status");

    // Tạo nhanh 28 target
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < TOTAL_IMAGES; i++) {
      const target = document.createElement('a-entity');
      target.setAttribute('mindar-image-target', `targetIndex: ${i}`);
      
      const plane = document.createElement('a-video');
      plane.setAttribute('src', '#ar-video');
      plane.setAttribute('width', '1');
      plane.setAttribute('height', '1.5'); 
      
      target.appendChild(plane);

      target.addEventListener("targetFound", () => {
        videoEl.play();
        statusLabel.innerText = "Đã nhận diện!";
        statusLabel.style.background = "rgba(0, 200, 0, 0.6)";
      });

      target.addEventListener("targetLost", () => {
        videoEl.pause();
        statusLabel.innerText = "Đang tìm hình ảnh...";
        statusLabel.style.background = "rgba(0, 0, 0, 0.6)";
      });

      fragment.appendChild(target);
    }
    container.appendChild(fragment);

    // Khi hệ thống đã sẵn sàng hoàn toàn
    sceneEl.addEventListener("ready", () => {
      statusLabel.innerText = "Đang quét tìm hình ảnh...";
      // Tự động load video vào bộ nhớ đệm
      videoEl.load();
    });

    // Xử lý lỗi nếu không tải được camera hoặc data
    sceneEl.addEventListener("arError", () => {
      statusLabel.innerText = "Lỗi khởi tạo AR. Vui lòng kiểm tra camera/HTTPS.";
      statusLabel.style.background = "rgba(200, 0, 0, 0.6)";
    });
  </script>
</body>
</html>
