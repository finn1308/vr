<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Siêu Tốc - Fix Lỗi Hiển Thị</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #000;
    }

    /* Màn hình bắt đầu - Cực kỳ quan trọng để kích hoạt âm thanh/video */
    #start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      cursor: pointer;
    }

    #start-btn {
      padding: 18px 50px;
      font-size: 20px;
      background: #e91e63;
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 20px rgba(233, 30, 99, 0.5);
      margin-top: 20px;
    }

    #scanning-status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 14px;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(5px);
      display: none;
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <div style="font-size: 24px; font-weight: bold;">SẴN SÀNG TRẢI NGHIỆM</div>
    <p style="margin: 15px 0; color: #ccc;">Chạm vào nút bên dưới để bắt đầu</p>
    <button id="start-btn">BẮT ĐẦU QUÉT</button>
  </div>

  <div id="scanning-status">Đang tìm hình ảnh...</div>

  <!-- Cấu hình Scene tối ưu cho 28 ảnh -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; maxTrack: 1; filterMinCF: 0.01; filterBeta: 100;" 
    color-space="sRGB" 
    renderer="colorManagement: true, antialias: false, precision: medium;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Thêm autoplay, muted và playsinline để trình duyệt cho phép hiện video ngay -->
      <video id="ar-video" 
             src="video.mp4" 
             crossorigin="anonymous" 
             loop="true" 
             autoplay="false"
             muted="true"
             playsinline 
             webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Container chứa các vùng nhận diện -->
    <a-entity id="targets-container"></a-entity>
    
  </a-scene>

  <script>
    const TOTAL_IMAGES = 28;
    const sceneEl = document.querySelector('a-scene');
    const videoEl = document.querySelector('#ar-video');
    const container = document.querySelector('#targets-container');
    const statusLabel = document.querySelector("#scanning-status");
    const startOverlay = document.querySelector("#start-overlay");

    // Tỉ lệ đồng nhất cho 28 tấm
    const FIXED_WIDTH = 1;
    const FIXED_HEIGHT = 1.5; 

    // Khởi tạo 28 mục tiêu
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < TOTAL_IMAGES; i++) {
      const targetEntity = document.createElement('a-entity');
      targetEntity.setAttribute('mindar-image-target', `targetIndex: ${i}`);
      
      const videoPlane = document.createElement('a-video');
      videoPlane.setAttribute('src', '#ar-video');
      videoPlane.setAttribute('width', FIXED_WIDTH);
      videoPlane.setAttribute('height', FIXED_HEIGHT);
      // Vị trí cực kỳ quan trọng: z=0.05 để nổi hẳn lên trên ảnh gốc
      videoPlane.setAttribute('position', '0 0 0.05'); 
      // Luôn hướng về camera
      videoPlane.setAttribute('rotation', '0 0 0');
      
      targetEntity.appendChild(videoPlane);

      // Xử lý sự kiện nhận diện
      targetEntity.addEventListener("targetFound", () => {
        statusLabel.innerText = "Đã nhận diện ảnh " + (i + 1);
        statusLabel.style.background = "rgba(233, 30, 99, 0.8)";
        
        // Bật âm thanh khi đã nhận diện (vì trước đó bị muted)
        videoEl.muted = false;
        videoEl.play().catch(e => {
          console.log("Video cần tương tác để phát");
          // Nếu vẫn lỗi, thử phát lại ở chế độ không tiếng
          videoEl.muted = true;
          videoEl.play();
        });
      });

      targetEntity.addEventListener("targetLost", () => {
        videoEl.pause();
        statusLabel.innerText = "Đang tìm hình ảnh...";
        statusLabel.style.background = "rgba(0, 0, 0, 0.7)";
      });

      fragment.appendChild(targetEntity);
    }
    container.appendChild(fragment);

    // Xử lý nút bắt đầu
    startOverlay.addEventListener("click", () => {
      startOverlay.style.opacity = "0";
      setTimeout(() => { startOverlay.style.display = "none"; }, 500);
      
      statusLabel.style.display = "block";
      
      // Bắt đầu AR
      sceneEl.systems["mindar-image-system"].start();
      
      // Kích hoạt nạp video
      videoEl.load();
      // Mẹo: Phát nhử 1 lần để trình duyệt cấp quyền
      videoEl.play().then(() => {
        videoEl.pause();
        videoEl.currentTime = 0;
      });
    });

    // Kiểm tra lỗi hệ thống
    sceneEl.addEventListener("arError", (event) => {
      statusLabel.innerText = "Lỗi Camera: Hãy dùng link HTTPS hoặc cấp quyền camera!";
      statusLabel.style.background = "#ff0000";
    });

    sceneEl.addEventListener("ready", () => {
      console.log("MindAR đã sẵn sàng quét 28 ảnh");
    });
  </script>
</body>
</html>
