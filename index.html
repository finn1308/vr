<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR 28 Ảnh - Một Video Hệ Thống</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #000;
    }

    /* Màn hình chờ khởi tạo */
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      transition: opacity 0.5s ease;
    }

    #start-btn {
      padding: 16px 45px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(45deg, #e91e63, #ff4081);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(233, 30, 99, 0.4);
      display: none; /* Hiện sau khi data sẵn sàng */
    }

    .loader {
      border: 4px solid #222;
      border-top: 4px solid #e91e63;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #status-text {
      margin-bottom: 25px;
      font-size: 16px;
      color: #bbb;
    }

    #scanning-status {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 14px;
      z-index: 100;
      display: none;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <div class="loader" id="loader-icon"></div>
    <div id="status-text">Đang tải dữ liệu 28 mục tiêu...</div>
    <button id="start-btn">BẮT ĐẦU QUÉT</button>
  </div>

  <div id="scanning-status">Đang quét tìm hình ảnh...</div>

  <!-- maxTrack: 1 để tối ưu hiệu năng chỉ quét 1 ảnh 1 lúc -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiScanning: no; maxTrack: 1;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Video dùng chung cho 28 ảnh -->
      <video id="ar-video" 
             src="video.mp4" 
             crossorigin="anonymous" 
             loop="true" 
             playsinline 
             webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Container cho các targets tự động -->
    <a-entity id="targets-container"></a-entity>
    
  </a-scene>

  <script>
    const TOTAL_IMAGES = 28;
    const startBtn = document.querySelector("#start-btn");
    const loaderIcon = document.querySelector("#loader-icon");
    const statusText = document.querySelector("#status-text");
    const uiOverlay = document.querySelector("#ui-overlay");
    const sceneEl = document.querySelector('a-scene');
    const videoEl = document.querySelector('#ar-video');
    const container = document.querySelector('#targets-container');

    // Tạo tự động 28 entity để nhận diện
    for (let i = 0; i < TOTAL_IMAGES; i++) {
      const targetEntity = document.createElement('a-entity');
      targetEntity.setAttribute('mindar-image-target', `targetIndex: ${i}`);
      
      const videoPlane = document.createElement('a-video');
      videoPlane.setAttribute('src', '#ar-video');
      videoPlane.setAttribute('position', '0 0 0');
      
      // Tỉ lệ khổ dọc 2:3 (width=1, height=1.5)
      videoPlane.setAttribute('width', '1');
      videoPlane.setAttribute('height', '1.5');
      
      targetEntity.appendChild(videoPlane);
      
      // Sự kiện khi tìm thấy ảnh bất kỳ trong 28 ảnh
      targetEntity.addEventListener("targetFound", () => {
        console.log(`Đã nhận diện ảnh thứ ${i + 1}`);
        document.querySelector("#scanning-status").innerText = `Đang phát video (Ảnh ${i + 1})`;
        document.querySelector("#scanning-status").style.borderColor = "#e91e63";
        
        // Phát video chung
        videoEl.play().catch(e => console.log("Yêu cầu tương tác trước khi phát âm thanh"));
      });

      targetEntity.addEventListener("targetLost", () => {
        videoEl.pause();
        document.querySelector("#scanning-status").innerText = "Đang quét tìm hình ảnh...";
        document.querySelector("#scanning-status").style.borderColor = "rgba(255,255,255,0.2)";
      });

      container.appendChild(targetEntity);
    }

    // Khi MindAR đã load xong file .mind
    sceneEl.addEventListener("ready", () => {
      loaderIcon.style.display = "none";
      statusText.innerText = "Hệ thống đã sẵn sàng!";
      startBtn.style.display = "block";
    });

    startBtn.addEventListener("click", () => {
      uiOverlay.style.opacity = "0";
      setTimeout(() => { uiOverlay.style.display = "none"; }, 500);
      document.querySelector("#scanning-status").style.display = "block";
      
      // Khởi động Camera và AR
      sceneEl.systems["mindar-image-system"].start();
      videoEl.load();
    });
  </script>
</body>
</html>
