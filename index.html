<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Siêu Tốc - Chống Rung & Méo Hình</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #000;
    }

    /* Màn hình khởi đầu chuyên nghiệp */
    #start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, #222, #000);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      cursor: pointer;
    }

    #start-btn {
      padding: 18px 60px;
      font-size: 20px;
      background: #e91e63;
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      box-shadow: 0 10px 30px rgba(233, 30, 99, 0.4);
      margin-top: 20px;
      transition: transform 0.2s;
    }

    #start-btn:active { transform: scale(0.95); }

    #scanning-status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 12px 30px;
      border-radius: 40px;
      font-size: 14px;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      display: none;
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <div style="font-size: 26px; font-weight: bold; letter-spacing: 1px;">TRẢI NGHIỆM AR</div>
    <p style="margin: 10px 0; color: #aaa;">Vui lòng cấp quyền Camera khi được hỏi</p>
    <button id="start-btn">BẮT ĐẦU</button>
  </div>

  <div id="scanning-status">Đang tìm hình ảnh...</div>

  <!-- 
    TỐI ƯU CHỐNG RUNG (Smoothing):
    - filterMinCF: Tăng lên 0.001 để giảm rung lắc li ti.
    - filterBeta: Giảm xuống 10 để video không bị đuổi theo ảnh quá chậm.
    - missTolerance: Cho phép mất dấu 5 khung hình mới ẩn video, giúp ổn định.
  -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; maxTrack: 1; filterMinCF: 0.001; filterBeta: 10; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, antialias: true, precision: high;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="ar-video" 
             src="video.mp4" 
             crossorigin="anonymous" 
             loop="true" 
             autoplay="false"
             muted="true"
             playsinline 
             webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="targets-container"></a-entity>
    
  </a-scene>

  <script>
    const TOTAL_IMAGES = 28;
    const sceneEl = document.querySelector('a-scene');
    const videoEl = document.querySelector('#ar-video');
    const container = document.querySelector('#targets-container');
    const statusLabel = document.querySelector("#scanning-status");
    const startOverlay = document.querySelector("#start-overlay");

    // Tỉ lệ chuẩn 1:1.5 cho ảnh chân dung (Portrait)
    // Nếu ảnh bị méo, hãy điều chỉnh FIXED_HEIGHT ở đây
    const FIXED_WIDTH = 1;
    const FIXED_HEIGHT = 1.45; 

    const fragment = document.createDocumentFragment();
    for (let i = 0; i < TOTAL_IMAGES; i++) {
      const targetEntity = document.createElement('a-entity');
      targetEntity.setAttribute('mindar-image-target', `targetIndex: ${i}`);
      
      const videoPlane = document.createElement('a-video');
      videoPlane.setAttribute('src', '#ar-video');
      videoPlane.setAttribute('width', FIXED_WIDTH);
      videoPlane.setAttribute('height', FIXED_HEIGHT);
      
      // Vị trí: z=0.01 là đủ để không bị nháy, không nên quá cao để tránh cảm giác video bay lơ lửng
      videoPlane.setAttribute('position', '0 0 0.01'); 
      
      targetEntity.appendChild(videoPlane);

      targetEntity.addEventListener("targetFound", () => {
        statusLabel.innerText = "Đã nhận diện: " + (i + 1);
        statusLabel.style.borderColor = "#e91e63";
        
        videoEl.muted = false;
        videoEl.play().catch(() => {
          videoEl.muted = true;
          videoEl.play();
        });
      });

      targetEntity.addEventListener("targetLost", () => {
        videoEl.pause();
        statusLabel.innerText = "Đang quét tìm hình ảnh...";
        statusLabel.style.borderColor = "rgba(255,255,255,0.2)";
      });

      fragment.appendChild(targetEntity);
    }
    container.appendChild(fragment);

    startOverlay.addEventListener("click", () => {
      startOverlay.style.opacity = "0";
      setTimeout(() => { startOverlay.style.display = "none"; }, 400);
      statusLabel.style.display = "block";
      
      sceneEl.systems["mindar-image-system"].start();
      videoEl.load();
      videoEl.play().then(() => {
        videoEl.pause();
        videoEl.currentTime = 0;
      });
    });

    sceneEl.addEventListener("arError", () => {
      statusLabel.innerText = "Lỗi: Hãy mở bằng HTTPS và cho phép Camera!";
      statusLabel.style.background = "#ff1744";
    });
  </script>
</body>
</html>
