<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Siêu Tốc - 28 Ảnh</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #000;
    }

    #ui-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      transition: opacity 0.3s ease;
    }

    #start-btn {
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #e91e63;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: none;
    }

    .loader {
      border: 3px solid #222;
      border-top: 3px solid #e91e63;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #scanning-status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 100;
      display: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <div class="loader" id="loader-icon"></div>
    <div id="status-text" style="margin-bottom: 20px;">Đang tải dữ liệu...</div>
    <button id="start-btn">BẮT ĐẦU</button>
  </div>

  <div id="scanning-status">Đang tìm hình ảnh...</div>

  <!-- 
    TỐI ƯU: 
    - filterMinCF, filterBeta: Giảm độ trễ khi khớp ảnh.
    - warmUpTolerance: Tăng tốc độ khởi động camera.
    - missTolerance: Giúp video không bị mất ngay lập tức khi tay rung nhẹ.
  -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiScanning: no; maxTrack: 1; filterMinCF: 0.1; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, antialias: false, precision: medium;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="ar-video" 
             src="video.mp4" 
             crossorigin="anonymous" 
             loop="true" 
             playsinline 
             webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="targets-container"></a-entity>
    
  </a-scene>

  <script>
    const TOTAL_IMAGES = 28;
    const sceneEl = document.querySelector('a-scene');
    const videoEl = document.querySelector('#ar-video');
    const container = document.querySelector('#targets-container');

    // Tạo nhanh 28 target bằng DocumentFragment để tối ưu DOM
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < TOTAL_IMAGES; i++) {
      const target = document.createElement('a-entity');
      target.setAttribute('mindar-image-target', `targetIndex: ${i}`);
      
      const plane = document.createElement('a-video');
      plane.setAttribute('src', '#ar-video');
      plane.setAttribute('width', '1');
      plane.setAttribute('height', '1.5'); // Khổ dọc ảnh Hồng Hạnh
      
      target.appendChild(plane);

      target.addEventListener("targetFound", () => {
        videoEl.play();
        document.querySelector("#scanning-status").innerText = "Đã nhận diện!";
      });

      target.addEventListener("targetLost", () => {
        videoEl.pause();
        document.querySelector("#scanning-status").innerText = "Đang tìm hình ảnh...";
      });

      fragment.appendChild(target);
    }
    container.appendChild(fragment);

    sceneEl.addEventListener("ready", () => {
      document.querySelector("#loader-icon").style.display = "none";
      document.querySelector("#status-text").innerText = "Sẵn sàng!";
      document.querySelector("#start-btn").style.display = "block";
    });

    document.querySelector("#start-btn").addEventListener("click", () => {
      document.querySelector("#ui-overlay").style.display = "none";
      document.querySelector("#scanning-status").style.display = "block";
      sceneEl.systems["mindar-image-system"].start();
      // Mẹo: play rồi pause ngay để video sẵn sàng trong bộ nhớ đệm
      videoEl.play().then(() => videoEl.pause());
    });
  </script>
</body>
</html>
