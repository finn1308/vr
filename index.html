<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Siêu Tốc - 28 Ảnh</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #000;
    }

    /* Màn hình bắt đầu bắt buộc để kích hoạt Video/Âm thanh */
    #start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
    }

    #start-btn {
      padding: 15px 40px;
      font-size: 18px;
      background: #e91e63;
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: bold;
    }

    #scanning-status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(4px);
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <p style="margin-bottom: 20px;">Chạm để bắt đầu trải nghiệm AR</p>
    <button id="start-btn">BẮT ĐẦU</button>
  </div>

  <div id="scanning-status">Đang khởi tạo AR...</div>

  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; maxTrack: 1; filterMinCF: 0.1; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, antialias: false, precision: medium;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Chú ý: Đảm bảo file video.mp4 tồn tại -->
      <video id="ar-video" 
             src="video.mp4" 
             crossorigin="anonymous" 
             loop="true" 
             playsinline 
             webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="targets-container"></a-entity>
    
  </a-scene>

  <script>
    const TOTAL_IMAGES = 28;
    const sceneEl = document.querySelector('a-scene');
    const videoEl = document.querySelector('#ar-video');
    const container = document.querySelector('#targets-container');
    const statusLabel = document.querySelector("#scanning-status");
    const startOverlay = document.querySelector("#start-overlay");

    // Tạo 28 target
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < TOTAL_IMAGES; i++) {
      const target = document.createElement('a-entity');
      target.setAttribute('mindar-image-target', `targetIndex: ${i}`);
      
      const plane = document.createElement('a-video');
      plane.setAttribute('src', '#ar-video');
      plane.setAttribute('width', '1');
      plane.setAttribute('height', '1.5'); 
      // Đẩy video lên trên mặt ảnh một chút để tránh lỗi hiển thị đè nhau
      plane.setAttribute('position', '0 0 0.01'); 
      
      target.appendChild(plane);

      target.addEventListener("targetFound", () => {
        videoEl.play();
        statusLabel.innerText = "Đã nhận diện!";
        statusLabel.style.background = "rgba(0, 200, 0, 0.6)";
      });

      target.addEventListener("targetLost", () => {
        videoEl.pause();
        statusLabel.innerText = "Đang tìm hình ảnh...";
        statusLabel.style.background = "rgba(0, 0, 0, 0.6)";
      });

      fragment.appendChild(target);
    }
    container.appendChild(fragment);

    // Kích hoạt AR khi người dùng chạm vào màn hình
    startOverlay.addEventListener("click", () => {
      startOverlay.style.display = "none";
      statusLabel.style.display = "block";
      
      // Khởi động hệ thống AR
      sceneEl.systems["mindar-image-system"].start();
      
      // Buộc video phải load và thử play/pause để xin quyền âm thanh
      videoEl.play().then(() => {
        videoEl.pause();
      }).catch(e => console.log("Chờ nhận diện để phát"));
    });

    sceneEl.addEventListener("ready", () => {
      statusLabel.innerText = "Sẵn sàng quét!";
    });

    sceneEl.addEventListener("arError", () => {
      statusLabel.innerText = "Lỗi Camera. Hãy dùng HTTPS!";
      statusLabel.style.background = "rgba(200, 0, 0, 0.6)";
    });
  </script>
</body>
</html>
